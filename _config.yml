title: brBlauuu
description: PhD Candidate @ Biozentrum
locale: en_US
author:
  name: "Đorđe Relić"
  email: # Optional - add if you want
  url: "https://brlauuu.github.io"

url: "https://brlauuu.github.io"
baseurl: ""

# Tale theme
remote_theme: chesterhow/tale

# Permalinks
permalink: /:year-:month-:day/:title

# Pagination
paginate: 5
paginate_path: "/page:num/"

# Posts default to English; set lang: yu or lang: sr in front matter otherwise.
defaults:
  - scope:
      type: posts
    values:
      lang: en
  # English posts live in _posts/en/ under an /en/ URL prefix; their pre-prefix
  # URLs redirect via redirect_from in each post (jekyll-redirect-from).
  - scope:
      path: "_posts/en"
      type: posts
    values:
      lang: en
      permalink: /en/:year-:month-:day/:title
  # Posts in _posts/yu/ (Naš, Latin) and _posts/sr/ (Српски, Cyrillic) get their
  # language from the folder and a /yu/ or /sr/ URL prefix (a post can exist in both
  # scripts on one date). og:locale has no Serbo-Croatian code, so both use sr_RS.
  - scope:
      path: "_posts/yu"
      type: posts
    values:
      lang: yu
      locale: sr_RS
      permalink: /yu/:year-:month-:day/:title
  - scope:
      path: "_posts/sr"
      type: posts
    values:
      lang: sr
      locale: sr_RS
      permalink: /sr/:year-:month-:day/:title

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-redirect-from

# Social links (for footer)
social:
  github: brlauuu
  linkedin: dorderelic

# Navigation
navigation:
  - title: About
    url: /about
  - title: Archive
    url: /archive

include:
  - _pages

exclude:
  - .gitignore
  - docker-compose.yml
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - CLAUDE.md
  - AGENTS.md
  - docs
  - vercel.json
  - _config.vercel.yml
