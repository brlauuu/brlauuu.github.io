<article class="project-card" data-github-repo="{{ include.project.repository | escape }}" data-project-config="{{ include.project | jsonify | escape }}">
  <h2 class="project-name">{{ include.project.name | escape }}</h2>
  <div class="project-links">
    <a class="project-action" data-project-website role="link" aria-disabled="true" aria-label="{{ include.project.name | escape }} website unavailable" title="Website unavailable">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="4" ry="9"/><path d="M3 12h18"/></svg>
    </a>
    <a class="project-action" href="https://github.com/{{ include.project.repository | escape }}" aria-label="{{ include.project.name | escape }} on GitHub" title="View on GitHub">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M12 .75a11.25 11.25 0 0 0-3.56 21.92c.56.1.77-.24.77-.54v-2.1c-3.13.68-3.79-1.33-3.79-1.33-.51-1.3-1.25-1.65-1.25-1.65-1.02-.7.08-.69.08-.69 1.13.08 1.72 1.16 1.72 1.16 1 1.72 2.63 1.22 3.27.93.1-.73.39-1.22.71-1.5-2.5-.28-5.13-1.25-5.13-5.56 0-1.23.44-2.23 1.16-3.02-.12-.29-.5-1.43.11-2.98 0 0 .95-.3 3.09 1.15a10.8 10.8 0 0 1 5.63 0c2.15-1.46 3.09-1.15 3.09-1.15.61 1.55.23 2.69.11 2.98.72.79 1.16 1.79 1.16 3.02 0 4.32-2.64 5.27-5.15 5.55.4.35.76 1.03.76 2.08v3.11c0 .3.2.65.78.54A11.25 11.25 0 0 0 12 .75Z"/></svg>
    </a>
  </div>
  <div class="project-stats">
    <span class="project-stat">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m12 3 2.8 5.7 6.3.9-4.5 4.4 1.1 6.2-5.7-3-5.7 3 1.1-6.2-4.5-4.4 6.3-.9Z"/></svg>
      <span data-project-stars role="img" aria-label="Stars unavailable" title="Stars unavailable">—</span>
    </span>
    <span class="project-stat">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="6" cy="5" r="2.5"/><circle cx="18" cy="5" r="2.5"/><circle cx="12" cy="19" r="2.5"/><path d="M6 7.5v2a3 3 0 0 0 3 3h6a3 3 0 0 0 3-3v-2M12 12.5v4"/></svg>
      <span data-project-forks role="img" aria-label="Forks unavailable" title="Forks unavailable">—</span>
    </span>
    <span class="project-stat">
      {% if include.project.counter.label == 'users' %}
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true" focusable="false"><circle cx="9" cy="7" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M16 4a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 4v3"/></svg>
      {% else %}
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 3v12m-5-5 5 5 5-5M4 16v5h16v-5"/></svg>
      {% endif %}
      <span data-project-counter role="img" aria-label="{{ include.project.counter.label | default: 'downloads' | escape }} unavailable" title="Counter unavailable">—</span>
    </span>
  </div>
  {% if include.project.logo_url %}
    <img class="project-logo" src="{{ include.project.logo_url | escape }}" width="36" height="36" alt="" loading="lazy" decoding="async">
  {% endif %}
</article>
